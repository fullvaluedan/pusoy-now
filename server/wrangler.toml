name = "pusoy-now-auth"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Auth database. Binding is `env.DB` in the Worker; the physical database is the
# one created with `wrangler d1 create pusoy-now`.
[[d1_databases]]
binding = "DB"
database_name = "pusoy-now"
database_id = "350f2bdd-a4b0-4aae-af3c-0307ed80360e"

# Non-secret vars. Secrets (BETTER_AUTH_SECRET, RESEND_API_KEY,
# TURNSTILE_SECRET_KEY, provider + Stripe keys) are set with
# `wrangler secret put` and never committed. BETTER_AUTH_URL is filled in after
# the first deploy, once the workers.dev URL is known.
[vars]
BETTER_AUTH_URL = "https://pusoy-now-auth.fullvaluedan.workers.dev"
# Comma-separated web origins allowed to call the auth API, in addition to the
# built-in localhost dev origins and the pusoynow:// app scheme. Set to the
# deployed web origin when the app ships to the web.
# TRUSTED_ORIGINS = "https://your-web-origin"

# Live game rooms (U7). One Durable Object instance per room code, addressed
# with getByName(code). SQLite-backed so the WebSocket Hibernation API keeps
# idle rooms free and room state survives eviction/reconnect.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = true
